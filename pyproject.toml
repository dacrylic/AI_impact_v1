[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-impact-classifier"
version = "0.1.0"
description = "CPU-first LLM-label distillation for AI impact classification"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "openpyxl>=3.1",
  "joblib>=1.3",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "streamlit>=1.35",
  "uvicorn[standard]>=0.27",
]
embeddings = [
  "sentence-transformers>=2.7",
  "datasets>=2.19",
  "accelerate>=0.26",
  "protobuf>=4.25",
  "sentencepiece>=0.2",
  "tqdm>=4.66",
]

[project.scripts]
ai-impact-constrained-cv = "ai_impact_classifier.experiments.run_constrained_oof_stack_cv:main"
ai-impact-e3-audit = "ai_impact_classifier.experiments.make_e3_audit:main"
ai-impact-cpu-aux-retrieval-cv = "ai_impact_classifier.experiments.run_cpu_aux_retrieval_oof_cv:main"
ai-impact-train-production = "ai_impact_classifier.train_production_bundle:main"
ai-impact-task-deduplicated-cv = "ai_impact_classifier.experiments.run_task_deduplicated_cv:main"
ai-impact-role-task-disjoint-cv = "ai_impact_classifier.experiments.run_role_task_disjoint_cv:main"
ai-impact-role-task-disjoint-holdout = "ai_impact_classifier.experiments.run_role_task_disjoint_holdout:main"
ai-impact-task-deduplicated-transformer-cv = "ai_impact_classifier.experiments.run_task_deduplicated_transformer_cv:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
